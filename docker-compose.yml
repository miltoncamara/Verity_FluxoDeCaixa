# Sobe toda a solução: docker compose up -d --build
# As senhas abaixo têm padrão "local-dev" apenas para rodar localmente. Veja .env.example.
# Cada API roda com 2 réplicas atrás do nginx, que publica as portas 5001 (lançamentos) e 5002 (consolidado).
# Para mudar o número de réplicas: docker compose up -d --scale consolidado-api=3

name: fluxo-caixa

# Clientes da API, usados pelas duas APIs. Cada um tem a própria chave, permissões e limite por segundo.
# O limite vale por réplica. As APIs recebem só o hash SHA-256 de cada chave, nunca a chave em si.
# Os hashes padrão correspondem a local-dev-key, local-pdv-key e local-bi-key. Veja .env.example.
# Comando dos dois PostgreSQL: TLS ligado e regras de acesso que recusam conexão pela rede sem TLS.
# O certificado é o de teste da imagem oficial: serve para criptografar o tráfego local. Em produção,
# o certificado é o do serviço gerenciado e o cliente valida o servidor (SSL Mode=VerifyFull).
x-postgres-com-tls: &postgres-com-tls
  - postgres
  - -c
  - ssl=on
  - -c
  - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
  - -c
  - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
  - -c
  - hba_file=/etc/postgresql/pg_hba.conf

# Telemetria das duas APIs: traces, métricas e logs saem por OTLP para o OpenTelemetry Collector.
# Para mandar a outro destino, mude só o collector (infra/otel-collector/config.yaml).
x-observabilidade: &observabilidade
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
  # Logs do console em JSON, prontos para serem lidos por um agente de logs, com TraceId e SpanId
  # em cada linha para ligar o log ao trace.
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__IncludeScopes: "true"

x-clientes-da-api: &clientes-da-api
  # admin: tudo liberado, com limite alto para os testes de carga e de caos
  Seguranca__Clientes__0__Nome: admin
  Seguranca__Clientes__0__ChaveSha256: ${API_KEY_SHA256:-ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c}
  Seguranca__Clientes__0__Permissoes__0: lancamentos.escrita
  Seguranca__Clientes__0__Permissoes__1: lancamentos.leitura
  Seguranca__Clientes__0__Permissoes__2: consolidado.leitura
  Seguranca__Clientes__0__LimitePorSegundo: 20000
  # pdv: um ponto de venda, que só registra lançamentos
  Seguranca__Clientes__1__Nome: pdv
  Seguranca__Clientes__1__ChaveSha256: ${API_KEY_PDV_SHA256:-cf3e7f2e03dd372dda448cfd2aaaad6c001379f05f3b08e083836a9246a98c7f}
  Seguranca__Clientes__1__Permissoes__0: lancamentos.escrita
  Seguranca__Clientes__1__LimitePorSegundo: 20
  # bi: um sistema de relatórios, que só lê
  Seguranca__Clientes__2__Nome: bi
  Seguranca__Clientes__2__ChaveSha256: ${API_KEY_BI_SHA256:-76bfcb761ec5bc9649a0de6451834fdf4ba35b72c829f115b389227f702b58ec}
  Seguranca__Clientes__2__Permissoes__0: lancamentos.leitura
  Seguranca__Clientes__2__Permissoes__1: consolidado.leitura
  Seguranca__Clientes__2__LimitePorSegundo: 20

services:
  postgres-lancamentos:
    image: postgres:17
    # TLS ligado, com o certificado de teste que já vem na imagem, e conexão pela rede só com TLS.
    command: *postgres-com-tls
    environment:
      POSTGRES_DB: lancamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    ports:
      - "15432:5432"
    volumes:
      - lancamentos-data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lancamentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-consolidado:
    image: postgres:17
    # TLS ligado, com o certificado de teste que já vem na imagem, e conexão pela rede só com TLS.
    command: *postgres-com-tls
    environment:
      POSTGRES_DB: consolidado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    ports:
      - "15433:5432"
    volumes:
      - consolidado-data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consolidado"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fluxo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-dev}
    ports:
      - "5672:5672"
      - "15672:15672" # painel de administração: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos.Api/Dockerfile
    environment:
      ConnectionStrings__Lancamentos: "Host=postgres-lancamentos;Database=lancamentos;Username=postgres;Password=${POSTGRES_PASSWORD:-local-dev};SSL Mode=Require"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fluxo
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-local-dev}
      <<: [*clientes-da-api, *observabilidade]
    deploy:
      replicas: 2
    # Depende apenas do próprio banco. O RabbitMQ e o consolidado podem estar fora do ar.
    depends_on:
      postgres-lancamentos:
        condition: service_healthy
    restart: unless-stopped

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado.Api/Dockerfile
    environment:
      ConnectionStrings__Consolidado: "Host=postgres-consolidado;Database=consolidado;Username=postgres;Password=${POSTGRES_PASSWORD:-local-dev};SSL Mode=Require"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fluxo
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-local-dev}
      <<: [*clientes-da-api, *observabilidade]
    deploy:
      replicas: 2
    # O consumidor reconecta sozinho se o RabbitMQ não estiver de pé.
    depends_on:
      postgres-consolidado:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.31-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5001:5001" # Lancamentos.Api
      - "5002:5002" # Consolidado.Api
    depends_on:
      - lancamentos-api
      - consolidado-api
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - aspire-dashboard
    restart: unless-stopped

  # Visualizador local de traces, métricas e logs: http://localhost:18888
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # sem login, só para uso local
    ports:
      - "18888:18888"
    restart: unless-stopped

volumes:
  lancamentos-data:
  consolidado-data:
  rabbitmq-data:
