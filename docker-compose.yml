# Sobe toda a solução: docker compose up -d --build
# As senhas abaixo têm padrão "local-dev" apenas para rodar localmente. Veja .env.example.
# Cada API roda com 2 réplicas atrás do nginx, que publica as portas 5001 (lançamentos) e 5002 (consolidado).
# Para mudar o número de réplicas: docker compose up -d --scale consolidado-api=3

name: fluxo-caixa

# Clientes da API, usados pelas duas APIs. Cada um tem a própria chave, permissões e limite por segundo.
# O limite vale por réplica. As chaves têm padrão local-dev só para rodar localmente. Veja .env.example.
x-clientes-da-api: &clientes-da-api
  # admin: tudo liberado, com limite alto para os testes de carga e de caos
  Seguranca__Clientes__0__Nome: admin
  Seguranca__Clientes__0__Chave: ${API_KEY:-local-dev-key}
  Seguranca__Clientes__0__Permissoes__0: lancamentos.escrita
  Seguranca__Clientes__0__Permissoes__1: lancamentos.leitura
  Seguranca__Clientes__0__Permissoes__2: consolidado.leitura
  Seguranca__Clientes__0__LimitePorSegundo: 20000
  # pdv: um ponto de venda, que só registra lançamentos
  Seguranca__Clientes__1__Nome: pdv
  Seguranca__Clientes__1__Chave: ${API_KEY_PDV:-local-pdv-key}
  Seguranca__Clientes__1__Permissoes__0: lancamentos.escrita
  Seguranca__Clientes__1__LimitePorSegundo: 20
  # bi: um sistema de relatórios, que só lê
  Seguranca__Clientes__2__Nome: bi
  Seguranca__Clientes__2__Chave: ${API_KEY_BI:-local-bi-key}
  Seguranca__Clientes__2__Permissoes__0: lancamentos.leitura
  Seguranca__Clientes__2__Permissoes__1: consolidado.leitura
  Seguranca__Clientes__2__LimitePorSegundo: 20

services:
  postgres-lancamentos:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lancamentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    ports:
      - "15432:5432"
    volumes:
      - lancamentos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lancamentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-consolidado:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consolidado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev}
    ports:
      - "15433:5432"
    volumes:
      - consolidado-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consolidado"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fluxo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-dev}
    ports:
      - "5672:5672"
      - "15672:15672" # painel de administração: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos.Api/Dockerfile
    environment:
      ConnectionStrings__Lancamentos: "Host=postgres-lancamentos;Database=lancamentos;Username=postgres;Password=${POSTGRES_PASSWORD:-local-dev}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fluxo
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-local-dev}
      <<: *clientes-da-api
    deploy:
      replicas: 2
    # Depende apenas do próprio banco. O RabbitMQ e o consolidado podem estar fora do ar.
    depends_on:
      postgres-lancamentos:
        condition: service_healthy
    restart: unless-stopped

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado.Api/Dockerfile
    environment:
      ConnectionStrings__Consolidado: "Host=postgres-consolidado;Database=consolidado;Username=postgres;Password=${POSTGRES_PASSWORD:-local-dev}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: fluxo
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-local-dev}
      <<: *clientes-da-api
    deploy:
      replicas: 2
    # O consumidor reconecta sozinho se o RabbitMQ não estiver de pé.
    depends_on:
      postgres-consolidado:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5001:5001" # Lancamentos.Api
      - "5002:5002" # Consolidado.Api
    depends_on:
      - lancamentos-api
      - consolidado-api
    restart: unless-stopped

volumes:
  lancamentos-data:
  consolidado-data:
  rabbitmq-data:
