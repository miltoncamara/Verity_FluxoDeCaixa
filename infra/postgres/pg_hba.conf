# Regras de acesso dos dois PostgreSQL locais.

# Conexões locais pelo socket, dentro do próprio container: inicialização do banco e healthcheck.
local     all  all                trust

# Conexões pela rede só com TLS. Sem TLS, a conexão é recusada.
hostssl   all  all  0.0.0.0/0     scram-sha-256
hostssl   all  all  ::/0          scram-sha-256
hostnossl all  all  0.0.0.0/0     reject
hostnossl all  all  ::/0          reject
