# Balanceador de carga local. Fica na frente das réplicas das duas APIs e mantém as portas 5001 e 5002.
# Em produção esse papel seria do ingress do AKS, atrás do Azure Front Door.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # DNS interno do Docker. As réplicas são descobertas pelo nome do serviço e reavaliadas a cada 5 s,
    # então réplicas novas, reiniciadas ou removidas entram e saem do balanceamento sozinhas.
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log off;

    # Não revela a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # Barra corpos grandes já na borda, antes de chegarem às APIs (que também têm o mesmo limite).
    client_max_body_size 16k;

    # Uma réplica que acabou de parar deixa o IP sem resposta, e a conexão ficaria pendurada até o padrão
    # de 60 s. Na mesma rede conectar leva menos de 1 ms, então 1 s basta para desistir e tentar a outra
    # réplica. Isso vale também para POST, porque a requisição ainda não foi enviada.
    proxy_connect_timeout 1s;

    # Lançamentos: round robin entre as réplicas.
    upstream lancamentos {
        zone lancamentos 64k;
        server lancamentos-api:8080 resolve;
        keepalive 64;
    }

    # Consolidado: hash pela URL. A mesma data vai sempre para a mesma réplica, o que aumenta a taxa de
    # acerto do cache em memória e mantém o último valor conhecido na réplica que vai ser consultada.
    # Sem "consistent": o hash consistente monta o anel pelo nome do servidor, e aqui um único nome
    # resolve para várias réplicas. Com "consistent" todas ficariam com os mesmos pontos e o nginx
    # voltaria a alternar entre elas.
    upstream consolidado {
        zone consolidado 64k;
        hash $request_uri;
        server consolidado-api:8080 resolve;
        keepalive 64;
    }

    server {
        listen 5001;

        location / {
            proxy_pass http://lancamentos;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Mostra qual réplica respondeu, para ver o balanceamento acontecendo. Existe só neste
            # balanceador local. Em produção não se expõem endereços internos.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    server {
        listen 5002;

        location / {
            proxy_pass http://consolidado;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Se a réplica escolhida estiver fora, tenta a próxima. Só vale para GET, que é seguro repetir.
            proxy_next_upstream error timeout http_502 http_503;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
